[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agni-pipeline"
version = "0.1.0"
description = "AGNI-SCAN geospatial pipeline: FIRMS VIIRS detections to a Punjab verification-priority grid"
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
agni-pipeline = "agni_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agni_pipeline = ["default_scoring.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
